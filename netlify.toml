[build]
  command = "bun run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Tells Bing, Yandex and other IndexNow engines which pages changed, after each production deploy.
[[plugins]]
  package = "/netlify/plugins/indexnow"
  [plugins.inputs]
    # Public by design: IndexNow verifies it by fetching /<key>.txt from this site.
    key = "587c3f4a6ab199445038763851fae53a"

# The browser may talk to this site and, once a visitor accepts analytics, to Google Analytics - nothing else.
# 'unsafe-inline' stays because Astro and Starlight inline small scripts and styles; outside origins are still blocked.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; font-src 'self'; frame-src https://github.com https://plugins.jetbrains.com; frame-ancestors 'none'; form-action 'self'; base-uri 'self'; object-src 'none'"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
